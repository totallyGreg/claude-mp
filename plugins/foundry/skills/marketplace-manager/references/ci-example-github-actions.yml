# .github/workflows/plugin-validation.yml
# Validates Claude Code plugins and version bumps on PRs.
# Uses the repo-local scripts/validate.py installed by marketplace-manager setup.py
# (stdlib-only Python) plus Anthropic's `claude plugin validate`.

name: Plugin Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code CLI (for claude plugin validate)
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate and require version bumps
        run: python3 scripts/validate.py --check-versions --base origin/${{ github.base_ref }}

      - name: Check structure (advisory)
        run: python3 scripts/validate.py --check-structure || true
